<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e9e5" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found — Wright Gichana</title>
    <meta
      name="description"
      content="This page does not exist. Head back to Wright Gichana's portfolio to see his work, services and contact details."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
    />
    <style>
      :root {
        --bg: #e9e9e5;
        --sheet: #f5f5f2;
        --card: #ffffff;
        --ink: #171716;
        --ink-soft: #4c4c47;
        --muted: #a9a9a2;
        --line: rgba(23, 23, 22, 0.09);
        --teal-deep: #2fa6b1;
        --font-sans: 'General Sans', 'Inter', ui-sans-serif, system-ui, -apple-system,
          'Segoe UI', sans-serif;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
        border-radius: 6px;
      }

      .shell {
        width: min(100% - 1.75rem, 1560px);
        margin: 0.875rem auto;
        border-radius: 30px;
        background: var(--sheet);
        overflow: hidden;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.75) inset,
          0 40px 90px -60px rgba(15, 15, 14, 0.45);
      }

      .wrap {
        display: grid;
        place-items: center;
        min-height: calc(100svh - 1.75rem);
        padding: clamp(1.5rem, 5vw, 4rem) clamp(1rem, 4.2vw, 4.5rem);
      }

      .card {
        width: 100%;
        max-width: 42rem;
        margin-inline: auto;
        padding: clamp(1.6rem, 5vw, 3.4rem);
        text-align: center;
        background: var(--card);
        border: 1px solid rgba(23, 23, 22, 0.055);
        border-radius: 22px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.7) inset,
          0 24px 50px -46px rgba(12, 12, 12, 0.55);
        animation: rise 0.9s var(--ease-out) both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-size: 0.71rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .dot {
        width: 0.25rem;
        height: 0.25rem;
        border-radius: 999px;
        background: var(--teal-deep);
      }

      .code {
        margin: 1rem 0 0;
        font-size: clamp(4.5rem, 18vw, 9rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.06em;
      }

      .code span {
        color: var(--teal-deep);
      }

      h1 {
        margin: 0.5rem 0 0;
        font-size: clamp(1.35rem, 3vw, 2rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }

      .copy {
        max-width: 26rem;
        margin: 0.75rem auto 0;
        font-size: 0.92rem;
        line-height: 1.7;
        color: var(--ink-soft);
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 999px;
        padding: 0.85rem 1.45rem;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        transition:
          background-color 0.45s var(--ease-out),
          transform 0.45s var(--ease-out),
          box-shadow 0.45s var(--ease-out);
      }

      .btn svg {
        transition: transform 0.5s var(--ease-out);
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-dark {
        background: var(--ink);
        color: #fff;
      }

      .btn-dark:hover {
        background: #2f2f2c;
        box-shadow: 0 12px 24px -14px rgba(0, 0, 0, 0.55);
      }

      .btn-dark:hover svg {
        transform: translateX(-2px);
      }

      .btn-light {
        background: var(--sheet);
        border: 1px solid var(--line);
        color: var(--ink);
      }

      .btn-light:hover {
        background: #ecece7;
      }

      .btn-light:hover svg {
        transform: translate(2px, -2px);
      }

      .links {
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
      }

      .links p {
        margin: 0;
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.17em;
        text-transform: uppercase;
        color: var(--muted);
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem 1rem;
        margin-top: 0.75rem;
      }

      nav a {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--ink-soft);
        transition: color 0.3s var(--ease-out);
      }

      nav a:hover {
        color: var(--ink);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
        .btn,
        .btn svg {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <main class="wrap">
        <div class="card">
          <span class="eyebrow"><span class="dot"></span>Error 404</span>

          <p class="code" aria-hidden="true">4<span>0</span>4</p>

          <h1>This page went off the grid</h1>

          <p class="copy">
            The link may be broken, or the page may have moved. Let’s get you back to
            something that actually exists.
          </p>

          <div class="actions">
            <a class="btn btn-dark" href="/">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
              </svg>
              Back to home
            </a>
            <a class="btn btn-light" href="/#projects">
              View my projects
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 7h10v10" />
                <path d="M7 17 17 7" />
              </svg>
            </a>
          </div>

          <div class="links">
            <p>Or jump straight to</p>
            <nav aria-label="Quick links">
              <a href="/#about">About</a>
              <a href="/#services">Services</a>
              <a href="/#contact">Contact</a>
            </nav>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
